AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Backend serverless de Mision Emprende UDD

Parameters:
  Etapa:
    Type: String
    Default: dev

  ClaveToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Default: cambiar-esta-clave-antes-de-desplegar-123456

  ClaveAccesoProfesor:
    Type: String
    NoEcho: true
    Default: profe123

  DuracionTokenSegundos:
    Type: Number
    Default: 43200

  OrigenCors:
    Type: String
    Default: "*"

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 20
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        NOMBRE_TABLA: !Ref TablaPrincipal
        CLAVE_TOKEN: !Ref ClaveToken
        CLAVE_ACCESO_PROFESOR: !Ref ClaveAccesoProfesor
        DURACION_TOKEN_SEGUNDOS: !Ref DuracionTokenSegundos
        ORIGEN_CORS: !Ref OrigenCors
        DYNAMODB_ENDPOINT: ""
        NODE_OPTIONS: "--enable-source-maps"

Resources:
  ApiBackend:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Etapa
      CorsConfiguration:
        AllowOrigins:
          - !Ref OrigenCors
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  TablaPrincipal:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "MisionEmprende-${Etapa}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  FuncionAcceso:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/acceso/api.manejador
      Policies: &PermisosDynamo
        - DynamoDBCrudPolicy:
            TableName: !Ref TablaPrincipal
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt TablaPrincipal.Arn
                - !Sub "${TablaPrincipal.Arn}/index/*"
      Events:
        Ingresar:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/acceso/ingresar
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties: &ConfiguracionEsbuild
        Bundle: true
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs

  FuncionProfesor:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/profesor/api.manejador
      Policies: *PermisosDynamo
      Events:
        IngresarProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/ingresar
            Method: POST

        ListarSesionesProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones
            Method: GET

        CrearSesionesProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones
            Method: POST

        ObtenerControlSesion:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones/{sesionId}
            Method: GET

        EjecutarAccionSesion:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones/{sesionId}/acciones
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties: *ConfiguracionEsbuild

  FuncionSesiones:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/sesiones/api.manejador
      Policies: *PermisosDynamo
      Events:
        ObtenerSesionActual:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/sesiones/actual
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties: *ConfiguracionEsbuild

  FuncionFase1:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/fase1/api.manejador
      Policies: *PermisosDynamo
      Events:
        ObtenerEstado:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/estado
            Method: GET

        RegistrarPalabra:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/palabras
            Method: POST

        CompletarSopa:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/fase1/completar
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties: *ConfiguracionEsbuild

Outputs:
  UrlApi:
    Description: URL base de la API
    Value: !Sub "https://${ApiBackend}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Etapa}"

  NombreTabla:
    Description: Nombre de la tabla DynamoDB
    Value: !Ref TablaPrincipal
